<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Convert PNG to JPG online free with high quality using ImgFlex.">
      <link rel="icon"
      type="image/x-icon"

                       filename='images/fevicon.png') }}">
    <title>PNG to JPG Converter Online Free - ImgFlex</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center"
                href="/">

                    <img src="{{ url_for('static',
                                        filename='images/fevicon.png') }}"
                        alt="ImgFlex Logo"
                        width="40"
                        height="40"
                        class="me-2">

                    <span class="fw-bold">
                        ImgFlex
                    </span>

                </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <!-- <li class="nav-item">
                        <a class="nav-link" href="#features">Features</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#converter">Converter</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li> -->

                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a href="#converter"><button class="btn btn-custom">
                            Get Started
                        </button></a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <div class="container">

            <div class="row align-items-center justify-content-center">

                <div class="col-lg-6">

                    <h1>
                        Convert PNG to JPG Online Free & Easily
                    </h1>

                    <!-- <p>
                        ImgFlex helps you convert image formats, resize photos, and compress images with lightning-fast performance.
                    </p> -->

                    <a href="#converter"><button class="btn btn-custom mt-4 px-4 py-3">
                        Start Converting
                    </button></a>

                </div>


                <div class="col-lg-6 hero-image">

                    <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6?q=80&w=1200&auto=format&fit=crop" alt="Image Editing">

                </div>

            </div>


            <!-- Upload Card -->

            <div class="upload-card" id="converter">

                <h3 class="text-center fw-bold mb-4">
                    Upload Your Image
                </h3>
            
                <form id="convertForm"
                    action="/convert"
                    method="POST"
                    enctype="multipart/form-data">
            
                    <!-- File Upload -->
            
                    <div class="mb-4">
            
                        <label class="form-label fw-semibold">
                            Select Image
                        </label>
            
                        <input type="file"
                                id="imageInput"
                                name="image"
                                class="form-control"
                                accept="image/*"
                                required>
            
                    </div>
            
                    <!-- Width Height Format -->
            
                    <div class="row g-3">

                        <!-- Width -->
                    
                        <div class="col-md-3">
                    
                            <input type="number"
                                   name="width"
                                   class="form-control"
                                   placeholder="Width">
                    
                        </div>
                    
                        <!-- Height -->
                    
                        <div class="col-md-3">
                    
                            <input type="number"
                                   name="height"
                                   class="form-control"
                                   placeholder="Height">
                    
                        </div>
                    
                        <!-- Unit -->
                    
                        <div class="col-md-3">
                    
                            <select name="unit" class="form-select">
                    
                                <option value="px">Pixels</option>
                                <option value="mm">Millimeters</option>
                                <option value="cm">Centimeters</option>
                                <option value="in">Inches</option>
                    
                            </select>
                    
                        </div>
                    
                        <!-- Format -->
                    
                        <div class="col-md-3">
                    
                            <select name="format"
                                    class="form-select">
                    
                                <option value="png">PNG</option>
                                <option value="jpg" selected>JPG</option>
                                <option value="jpeg">JPEG</option>
                                <option value="webp">WEBP</option>
                                <option value="bmp">BMP</option>
                                <option value="tiff">TIFF</option>
                    
                            </select>
                    
                        </div>
                    
                    </div>

                    <div class="mt-4">

                        <label class="form-label fw-semibold">
                            Final File Size (KB)
                        </label>
                    
                        <input type="number"
                               name="target_size"
                               class="form-control"
                               placeholder="Example: 100">
                    
                    </div>





                    <!-- Preview Section -->

                    <div id="previewContainer" class="mt-4 d-none">

                        <div class="card border-0 shadow-sm p-3">

                            <div class="row align-items-center">

                                <!-- Image Preview -->

                                <div class="col-md-4 text-center">

                                    <img id="previewImage"
                                        src=""
                                        class="img-fluid rounded"
                                        style="max-height:200px; object-fit:contain;">

                                </div>

                                <!-- File Details -->

                                <div class="col-md-8 mt-4 mt-md-0">

                                    <h5 class="fw-bold mb-3">
                                        Image Details
                                    </h5>

                                    <p>
                                        <strong>File Name:</strong>
                                        <span id="fileName"></span>
                                    </p>

                                    <p>
                                        <strong>File Size:</strong>
                                        <span id="fileSize"></span>
                                    </p>

                                    <p>
                                        <strong>Dimensions:</strong>
                                        <span id="imageDimensions"></span>
                                    </p>

                                    <p>
                                        <strong>Format:</strong>
                                        <span id="imageFormat"></span>
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>
            
                    <!-- Submit -->
            
                    <button type="submit"
                        class="btn btn-custom w-100 mt-4 py-3">

                    Convert Image

                    </button>

                    
            
                </form>
            
            </div>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <div class="container">
            <p>
                © 2026 ImgFlex | All Rights Reserved
            </p>
        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>




    <script>

        // Reset form manually
    
        function resetForm(){
    
            document.getElementById("convertForm").reset();
    
        }
    
    
        // Auto clear form after submit
    
        document.getElementById("convertForm")
        .addEventListener("submit", function(){
    
            setTimeout(() => {
    
                document.getElementById("convertForm").reset();
    
            }, 2000);
    
        });
    
    </script>




<script>

    const imageInput = document.getElementById("imageInput");

    imageInput.addEventListener("change", function(event){

        const file = event.target.files[0];

        if(!file) return;

        // Show preview container

        document
        .getElementById("previewContainer")
        .classList.remove("d-none");

        // File details

        document.getElementById("fileName").innerText =
            file.name;

        document.getElementById("fileSize").innerText =
            (file.size / 1024).toFixed(2) + " KB";

        // Format

        const format = file.type.split('/')[1];

        document.getElementById("imageFormat").innerText =
            format.toUpperCase();

        // Preview image

        const reader = new FileReader();

        reader.onload = function(e){

            const img = new Image();

            img.onload = function(){

                document.getElementById("imageDimensions")
                .innerText =
                    img.width + " × " + img.height + " px";

            }

            img.src = e.target.result;

            document.getElementById("previewImage")
            .src = e.target.result;

        }

        reader.readAsDataURL(file);

    });


    // Reset form

    function resetForm(){

        document.getElementById("convertForm").reset();

        // Hide preview

        document
        .getElementById("previewContainer")
        .classList.add("d-none");

    }


    // Auto clear after submit

    document.getElementById("convertForm")
    .addEventListener("submit", function(){

        setTimeout(() => {

            resetForm();

        }, 2000);

    });

</script>

<!-- Visitor Counter -->

<div class="visitor-counter">

    👁 Visitors:
    {{ visitor_count }}

</div>
</body>
</html>
